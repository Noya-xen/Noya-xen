name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:  # ← tambah ini biar bisa run manual

permissions:
  contents: write  # ← tambah ini biar bisa push ke branch output

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Noya-xen
          outputs: |
            dist/github-contribution-grid-snake.svg

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # ← tambah ini juga
